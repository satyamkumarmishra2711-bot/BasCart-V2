<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>BasCart — Simulated Shopping</title>
    <script>
      // Single Page App redirect for GitHub Pages (supports both custom domain '/' and repo subpath '/BasCart-V2')
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        var repo = '/BasCart-V2';
        var lowerPath = path.toLowerCase();
        var lowerRepo = repo.toLowerCase();

        if (lowerPath.startsWith(lowerRepo)) {
          var route = path.slice(repo.length);
          if (route && route !== '/') {
            window.location.replace(repo + '/#' + route + (search ? search : '') + hash);
            return;
          }
          window.location.replace(repo + '/');
          return;
        }

        // Custom domain or root deployment (e.g. dreams.bascart.in)
        if (path && path !== '/') {
          window.location.replace('/#' + path + (search ? search : '') + hash);
          return;
        }
        window.location.replace('/');
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #fafaf9; color: #44403c;">
    <div style="text-align: center;">
      <p style="font-size: 1.125rem; font-weight: 600;">Loading BasCart...</p>
    </div>
  </body>
</html>
